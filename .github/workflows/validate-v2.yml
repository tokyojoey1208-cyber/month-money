name: Validate MY MONEY V2
on:
  push:
    branches: [v2-rebuild]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check snapshot-loader.js
      - run: node --check v4-core.js
      - run: node --check v4-home-flow.js
      - run: node --check v4-income.js
      - run: node --check v4-seed-more.js
      - run: node --check v4-init.js
      - run: node --check v5-ux-audit.js
      - run: node --check v6-selfqa.js
      - run: node --check apps-script/Code.gs
      - run: node tests/logic-selfqa.mjs
