<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#121c27" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MY MONEY V2</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./patch.css?v=20260904-3" />
  <link rel="stylesheet" href="./v4.css?v=20260904-9" />
</head>
<body>
  <header class="app-header">
    <button class="brand" data-go="home" aria-label="홈">
      <span class="brand-mark">∞</span>
      <span class="brand-copy"><strong>MY MONEY</strong><small>Cash Engine</small></span>
    </button>
    <div class="header-spacer"></div>
    <select id="monthSelect" class="month-select" aria-label="월 선택"></select>
    <button id="syncButton" class="icon-button" aria-label="데이터 상태">✓</button>
    <button id="quickButton" class="quick-button" aria-label="큰 지출 편집">＋</button>
  </header>
  <aside id="desktopNav" class="desktop-nav"></aside>
  <main class="app-main">
    <section id="screen-home" class="screen active" data-screen="home"></section>
    <section id="screen-flow" class="screen" data-screen="flow"></section>
    <section id="screen-income" class="screen" data-screen="income"></section>
    <section id="screen-seed" class="screen" data-screen="seed"></section>
    <section id="screen-more" class="screen" data-screen="more"></section>
  </main>
  <nav id="mobileNav" class="mobile-nav" aria-label="메인 메뉴"></nav>
  <div id="sheet" class="sheet" aria-hidden="true">
    <button id="sheetBackdrop" class="sheet-backdrop" aria-label="닫기"></button>
    <section class="sheet-panel" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div id="sheetContent"></div></section>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./snapshot-loader.js?v=20260904-9" defer></script>
</body>
</html>
